# OpenAI-compatible server config. vLLM usually exposes /v1.
base_url: http://localhost:8000/v1
api_key: EMPTY

# Replace with the model name served by vLLM.
model: Qwen/Qwen3-8B

qa_root: QA
output_dir: inference_outputs
splits: train,val
tasks: node,device

# Deterministic generation is preferred for config JSON.
temperature: 0
top_p: 1
max_tokens: 2048
timeout: 120

# Use json_object only if the backend/model supports it well.
# response_format: json_object

# 2 keeps input JSON readable in prompts; set to compact to reduce prompt tokens.
input_json_indent: 2
include_gold: false
